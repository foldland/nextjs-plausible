minimumReleaseAge: 4320 # 3 days - same as renovate
minimumReleaseAgeExclude:
  - "@foldland/*"
  # Security issues

registries:
  default: https://registry.npmjs.org/
  "@foldland": https://npm.registry.foldland.io/

# Dependency resolution
savePrefix: "" # pin dependencies by default
resolutionMode: "highest"
strictPeerDependencies: true
preferFrozenLockfile: true
autoDedupe: true
dedupePeers: true

# node version
engineStrict: true
ignorePnpmfile: true

# Security
blockExoticSubdeps: true
hoist: false
hoistWorkspacePackages: false
verifyDepsBeforeRun: "install"

allowBuilds:
  sharp: false

packages:
  - "packages/**"

catalog:
  "@vitejs/plugin-react": "6.1.2"
  "@vitest/coverage-v8": "5.0.3"
  "jsdom": "30.1.2"
  "typescript": "6.0.3"
  "vite-plugin-dts": "5.1.2"
  "vite": "8.3.4"
  "vitest": "5.0.3"

overrides:
  next@>=16.0.0 <16.3.8: 16.3.8
